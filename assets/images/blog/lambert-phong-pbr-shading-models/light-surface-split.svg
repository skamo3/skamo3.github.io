<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowMagenta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff33cc"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7186"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="460" rx="12" fill="#0c0f1a"/>
  <text x="20" y="32" fill="#6b7186" font-size="13">빛이 표면에서 갈라지는 경로</text>

  <!-- 표면 경계선: 위=공기, 아래=물체 내부 -->
  <line x1="30" y1="210" x2="610" y2="210" stroke="#c9c9d1" stroke-width="1.5"/>
  <text x="36" y="202" fill="#9aa0b5" font-size="12">공기</text>
  <text x="36" y="232" fill="#9aa0b5" font-size="12">물체 내부</text>

  <!-- 물체 내부 영역(살짝 다른 색) + 산란 입자 몇 개 -->
  <rect x="30" y="210" width="580" height="200" fill="#6b5a3f" fill-opacity="0.12"/>
  <circle cx="300" cy="262" r="3" fill="#c9a86a"/>
  <circle cx="324" cy="278" r="3" fill="#c9a86a"/>
  <circle cx="296" cy="296" r="3" fill="#c9a86a"/>

  <!-- 카메라(눈) 아이콘: 오른쪽 위 -->
  <g transform="translate(570,60)">
    <circle cx="0" cy="0" r="20" fill="#0c0f1a" stroke="#e8e8f0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="#22d3ee"/>
    <circle cx="-3" cy="-3" r="2.5" fill="#0c0f1a"/>
    <text x="0" y="36" fill="#9aa0b5" font-size="12" text-anchor="middle">카메라(눈)</text>
  </g>

  <!-- 입사광: 위에서 표면의 한 점 P로 -->
  <line x1="80" y1="60" x2="238" y2="206" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <text x="70" y="96" fill="#22d3ee" font-size="15" font-weight="600">입사광 100%</text>
  <circle cx="240" cy="210" r="3.5" fill="#e8e8f0"/>
  <text x="216" y="226" fill="#9aa0b5" font-size="13">P</text>

  <!-- 정반사: P에서 거울 각도로 튕겨나가 카메라로 (왼쪽 영역만 사용) -->
  <line x1="240" y1="210" x2="440" y2="72" stroke="#ff33cc" stroke-width="3" marker-end="url(#arrowMagenta)"/>
  <text x="255" y="150" fill="#ff33cc" font-size="15" font-weight="700">정반사</text>

  <!-- 굴절되어 안으로 들어감 -->
  <line x1="240" y1="210" x2="300" y2="262" stroke="#8a92ac" stroke-width="2.5" marker-end="url(#arrowDim)"/>

  <!-- 내부 산란 경로 (입자 사이를 튕겨다님) -->
  <path d="M 300,262 L 324,278 L 296,296 L 400,268" fill="none" stroke="#8a92ac" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- 다시 표면 밖으로 나와 여러 방향으로 확산 (오른쪽 영역만 사용) -->
  <line x1="400" y1="268" x2="400" y2="209" stroke="#8a92ac" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="400" cy="210" r="3.5" fill="#e8e8f0"/>
  <text x="406" y="226" fill="#9aa0b5" font-size="13">Q</text>

  <line x1="400" y1="210" x2="600" y2="130" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <line x1="400" y1="210" x2="560" y2="200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)" opacity="0.55"/>
  <line x1="400" y1="210" x2="480" y2="80" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)" opacity="0.55"/>
  <text x="470" y="245" fill="#22d3ee" font-size="15" font-weight="600">확산</text>

  <!-- 흡수: 산란 중 일부는 안 나오고 열로 -->
  <line x1="324" y1="278" x2="280" y2="340" stroke="#6b7186" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrowDim)"/>
  <text x="220" y="360" fill="#6b7186" font-size="14">흡수 → 열</text>

  <!-- 하단 범례: 각 경로가 뭘 뜻하는지 짧게 -->
  <g transform="translate(30,398)" font-size="13">
    <circle cx="4" cy="-4" r="4" fill="#ff33cc"/>
    <text x="14" y="0" fill="#c9c9d1">정반사 — 표면에서 즉시 튕겨나감</text>
  </g>
  <g transform="translate(30,420)" font-size="13">
    <circle cx="4" cy="-4" r="4" fill="#22d3ee"/>
    <text x="14" y="0" fill="#c9c9d1">확산 — 안으로 들어갔다 흩어져서 여러 방향으로 나옴</text>
  </g>
  <g transform="translate(30,442)" font-size="13">
    <circle cx="4" cy="-4" r="4" fill="#6b7186"/>
    <text x="14" y="0" fill="#c9c9d1">흡수 — 밖으로 안 나오고 열로 사라짐 (정반사 + 확산 + 흡수 = 100%, 에너지 보존)</text>
  </g>
</svg>
