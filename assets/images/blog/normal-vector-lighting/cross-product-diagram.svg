<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowMagenta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff33cc"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a92ac"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="560" height="400" rx="12" fill="#0c0f1a"/>
  <text x="20" y="34" fill="#6b7186" font-size="13">지형 삼각형 하나 (v0, v1, v2)</text>

  <!-- 바닥선(지면 기준선) -->
  <line x1="40" y1="330" x2="520" y2="330" stroke="#2a2f45" stroke-width="1.5"/>

  <!-- 언덕처럼 기울어진 삼각형: v0, v1 은 지면 근처, v2 는 heightmap으로 솟은 정점 -->
  <polygon points="150,300 380,325 260,150" fill="#6b5a3f" fill-opacity="0.35" stroke="#c9c9d1" stroke-width="1.5"/>

  <!-- 정점 표시 -->
  <circle cx="150" cy="300" r="4" fill="#e8e8f0"/>
  <text x="128" y="322" fill="#9aa0b5" font-size="15">v0</text>
  <circle cx="380" cy="325" r="4" fill="#e8e8f0"/>
  <text x="388" y="322" fill="#9aa0b5" font-size="15">v1</text>
  <circle cx="260" cy="150" r="4" fill="#e8e8f0"/>
  <text x="268" y="145" fill="#9aa0b5" font-size="15">v2 (솟은 정점)</text>

  <!-- 벡터 a = v1 - v0 -->
  <line x1="150" y1="300" x2="372" y2="324" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <text x="235" y="345" fill="#22d3ee" font-size="19" font-weight="600">a = v1 − v0</text>

  <!-- 벡터 b = v2 - v0 -->
  <line x1="150" y1="300" x2="254" y2="158" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <text x="90" y="232" fill="#22d3ee" font-size="19" font-weight="600">b = v2 − v0</text>

  <!-- 법선 n = a x b, 삼각형 무게중심에서 위로 -->
  <line x1="263" y1="258" x2="220" y2="90" stroke="#ff33cc" stroke-width="3.5" marker-end="url(#arrowMagenta)"/>
  <text x="222" y="78" fill="#ff33cc" font-size="20" font-weight="700">n = a × b</text>

  <!-- 회전 방향 표시: a에서 b로 도는 방향이 n이 나오는 쪽을 정한다 -->
  <path d="M 92,268 A 42,42 0 0,1 112,206" fill="none" stroke="#8a92ac" stroke-width="1.5" marker-end="url(#arrowDim)"/>

  <text x="20" y="378" fill="#9aa0b5" font-size="14">a → b로 도는 방향(오른손 법칙)이 n이 튀어나오는 쪽을 정한다</text>
</svg>
