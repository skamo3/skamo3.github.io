<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rendering Lab — 하나의 월드로 배우는 렌더링</title>
<style>
  :root { --fg:#e8e8f0; --muted:#9aa0b5; --dim:#6b7186; --cyan:#22d3ee; --magenta:#ff33cc;
    --bg:#05060a; --panel:#0c0f1a; --line:rgba(34,211,238,0.18); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
  #layout { display:flex; height:100vh; }

  /* ── 사이드바 ── */
  #sidebar { width:240px; flex:0 0 240px; background:var(--panel); border-right:1px solid var(--line);
    overflow-y:auto; padding:16px 0; }
  #sidebar .brand { padding:0 18px 14px; font-size:15px; font-weight:700; letter-spacing:.3px; }
  #sidebar .brand span { color:var(--cyan); }
  #sidebar .site-back { display:flex; gap:14px; padding:2px 18px 12px; }
  #sidebar .site-back a { font-size:12px; color:var(--muted); text-decoration:none; }
  #sidebar .site-back a:hover { color:var(--cyan); }
  #post-cards { position:absolute; right:16px; bottom:16px; z-index:5; display:flex;
    flex-direction:column; gap:8px; align-items:flex-end; }
  .post-card { display:block; padding:9px 13px; border:1px solid rgba(255,255,255,0.7);
    background:rgba(0,0,0,0.45); backdrop-filter:blur(4px); border-radius:8px;
    color:#fff; text-decoration:none; max-width:420px; transition:all .15s; }
  .post-card:hover { border-color:#fff; background:rgba(0,0,0,0.7); }
  .post-card .label { display:block; font-size:10px; color:var(--muted); margin-bottom:2px; letter-spacing:.3px; }
  .post-card .title { font-size:13px; font-weight:600; white-space:nowrap; }
  .nav-chapter { padding:14px 18px 6px; font-size:11px; font-weight:700; letter-spacing:.5px;
    color:var(--dim); text-transform:uppercase; }
  .nav-item { display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 18px; font-size:13px; color:var(--muted); text-decoration:none; cursor:pointer;
    border-left:2px solid transparent; }
  .nav-item:hover { color:var(--fg); background:rgba(255,255,255,0.03); }
  .nav-item.active { color:var(--fg); border-left-color:var(--cyan); background:rgba(34,211,238,0.08); }
  .nav-item.disabled { color:#4a5069; cursor:default; pointer-events:none; }
  .nav-item .soon { font-size:10px; color:var(--dim); border:1px solid rgba(255,255,255,0.1);
    border-radius:999px; padding:1px 7px; }

  /* ── 스테이지 ── */
  #stage { position:relative; flex:1; min-width:0; }
  #gl { display:block; width:100%; height:100%; }
  #topbar { position:absolute; left:16px; top:14px; z-index:5; font-size:13px; color:var(--muted);
    background:rgba(10,12,20,0.6); backdrop-filter:blur(6px); border:1px solid var(--line);
    border-radius:8px; padding:7px 13px; }
  #topbar b { color:var(--fg); font-weight:600; }
  #error { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:6; display:none;
    max-width:520px; padding:16px 20px; background:rgba(40,10,20,0.85); border:1px solid var(--magenta);
    border-radius:10px; font-size:13px; line-height:1.6; color:#ffd; }

  /* ── 모바일: 240px 고정 사이드바를 두면 스테이지가 100px대로 남는다.
     챕터 목록을 가로로 스크롤되는 상단 바로 접고 3D는 남는 높이를 다 쓴다 ── */
  @media (max-width: 760px) {
    html, body { height:100dvh; }
    #layout { flex-direction:column; height:100dvh; }
    #sidebar { width:100%; flex:0 0 auto; padding:8px 0 6px;
      border-right:none; border-bottom:1px solid var(--line); overflow:visible; }
    #sidebar .brand { display:none; }
    #sidebar .site-back { padding:0 12px 8px; }
    #nav { display:flex; align-items:center; gap:6px; overflow-x:auto;
      padding:0 12px 2px; scrollbar-width:none; }
    #nav::-webkit-scrollbar { display:none; }
    .nav-chapter { flex:0 0 auto; padding:0 2px 0 6px; }
    .nav-item { flex:0 0 auto; padding:6px 12px; font-size:12px; white-space:nowrap;
      border-left:none; border:1px solid rgba(255,255,255,0.12); border-radius:999px; }
    .nav-item.active { border-color:var(--cyan); }
    .nav-item .soon { display:none; }
    #stage { flex:1 1 auto; min-height:0; }
    #topbar { left:10px; top:10px; font-size:12px; padding:5px 10px; }
    #post-cards { left:10px; right:10px; bottom:10px; align-items:stretch; }
    .post-card { max-width:none; }
    .post-card .title { white-space:normal; }
    #error { max-width:calc(100% - 32px); font-size:12px; }
  }
</style>
</head>
<body>
<div id="layout">
  <nav id="sidebar">
    <div class="site-back">
      <a href="/">← Home</a>
      <a href="/blog/">블로그</a>
    </div>
    <div class="brand">Rendering <span>Lab</span></div>
    <div id="nav"></div>
  </nav>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="topbar"><b id="world-title">로딩 중…</b></div>
    <div id="post-cards"></div>
    <div id="error"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./common/app.js"></script>
</body>
</html>
